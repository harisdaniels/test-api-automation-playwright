name: Playwright API Tests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Test tag to run'
        type: choice
        options:
          - all
          - '@smoke'
          - '@positive'
          - '@negative'
        default: all
  schedule:
    - cron: '0 15 * * 5'
    - cron: '0 0 * * 0'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          TEST_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            npx playwright test --grep "@smoke"
          elif [ -z "$TEST_TAG" ] || [ "$TEST_TAG" = "all" ]; then
            npx playwright test
          else
            npx playwright test --grep "$TEST_TAG"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-reports
          path: |
            playwright-report/
            reports/
