name: Playwright API Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 5'
    - cron: '0 0 * * 0'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npx playwright test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-reports
          path: |
            playwright-report/
            reports/
